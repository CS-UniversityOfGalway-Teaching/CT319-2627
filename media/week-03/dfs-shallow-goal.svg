<svg xmlns="http://www.w3.org/2000/svg" width="960" height="614" viewBox="0 0 960 614" role="img" aria-labelledby="title desc">
  <title id="title">A shallow goal that depth-first search does not reach</title>
  <desc id="desc">The start state has two children: a long chain A to E on the left, and the goal on the right. Depth-first search follows the left chain to its bottom before ever examining the goal, which sits one move from the start.</desc>

  <style>
    :root {
      --bg:#ffffff; --fg:#1f2328; --muted:#57606a; --line:#d0d7de;
      --accent:#0969da; --panel:#f6f8fa; --card:#ffffff;
      --frontier:#8250df; --frontierbg:#f5eeff;
      --current:#9a6700;  --currentbg:#fff8c5;
      --done:#57606a;     --donebg:#eaeef2;
      --goal:#1a7f37;     --goalbg:#dafbe1;
      --bad:#cf222e;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d;
        --accent:#58a6ff; --panel:#161b22; --card:#0d1117;
        --frontier:#a371f7; --frontierbg:#1d162b;
        --current:#d29922;  --currentbg:#2b2413;
        --done:#8b949e;     --donebg:#161b22;
        --goal:#3fb950;     --goalbg:#0f2916;
        --bad:#f85149; }
    }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--fg); }
    .lab  { font-size:14px; font-weight:700; letter-spacing:1.4px; fill:var(--accent); }
    .note { font-size:14px; fill:var(--muted); }
    .cap  { font-size:12.5px; fill:var(--muted); }
    .node { font-size:17px; font-weight:700; }
    .ord  { font-size:12px; font-weight:700; fill:var(--muted); }
    .circ { fill:var(--card); stroke:var(--line); stroke-width:2.2; }
    .circG{ fill:var(--goalbg); stroke:var(--goal); stroke-width:2.8; }
    .circS{ fill:var(--panel); stroke:var(--accent); stroke-width:2.8; }
    .edge { stroke:var(--muted); stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .edgeBad { stroke:var(--bad); stroke-width:2.4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .box  { fill:var(--card); stroke:var(--line); stroke-width:1.8; }
    .boxA { fill:var(--panel); stroke:var(--accent); stroke-width:2.2; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; }
  </style>

  <rect width="960" height="614" rx="18" fill="var(--bg)"/>
  <text class="lab" x="30" y="38">DEPTH-FIRST SEARCH CAN WALK STRAIGHT PAST THE ANSWER</text>
  <path class="edge" d="M403 115 L253 189"/>
  <path class="edge" d="M267 190 L253 189 L261 177"/>
  <path class="edge" d="M457 115 L606 184"/>
  <path class="edge" d="M598 172 L606 184 L592 186"/>
  <path class="edge" d="M230 226 L230 256"/>
  <path class="edge" d="M237 244 L230 256 L223 244"/>
  <path class="edge" d="M230 308 L230 338"/>
  <path class="edge" d="M237 326 L230 338 L223 326"/>
  <path class="edge" d="M230 390 L230 420"/>
  <path class="edge" d="M237 408 L230 420 L223 408"/>
  <path class="edge" d="M230 472 L230 502"/>
  <path class="edge" d="M237 490 L230 502 L223 490"/>
  <circle class="circS" cx="430" cy="102" r="30"/>
  <text class="node" x="430" y="108" text-anchor="middle" style="font-size:16px">S</text>
  <circle class="circG" cx="640" cy="200" r="38"/>
  <text class="node" x="640" y="206" text-anchor="middle" style="font-size:15px">Goal</text>
  <circle class="circ" cx="230" cy="200" r="26"/>
  <text class="node" x="230" y="206" text-anchor="middle" style="font-size:15px">A</text>
  <circle class="circ" cx="230" cy="282" r="26"/>
  <text class="node" x="230" y="288" text-anchor="middle" style="font-size:15px">B</text>
  <circle class="circ" cx="230" cy="364" r="26"/>
  <text class="node" x="230" y="370" text-anchor="middle" style="font-size:15px">C</text>
  <circle class="circ" cx="230" cy="446" r="26"/>
  <text class="node" x="230" y="452" text-anchor="middle" style="font-size:15px">D</text>
  <circle class="circ" cx="230" cy="528" r="26"/>
  <text class="node" x="230" y="534" text-anchor="middle" style="font-size:15px">E</text>
  <text class="note" x="692" y="195">one move from the start</text>
  <text class="note" x="692" y="217" style="fill:var(--goal);font-weight:700">and never examined</text>
  <text class="cap" x="290" y="352">depth-first follows this branch to the</text>
  <text class="cap" x="290" y="372">bottom first, because E was generated last</text>
  <text class="note" x="30" y="586">Which branch opens first depends only on the order successors were generated. Nothing here is about promise.</text>
</svg>

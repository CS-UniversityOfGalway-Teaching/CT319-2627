<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
  <title id="title">A FIFO frontier: remove from the front, add at the back</title>
  <desc id="desc">The frontier holds A, B, C, D. Removal happens at the front, so A leaves first. Expanding A generates E and F, which are added at the back behind B, C and D. The older waiting states therefore keep their turn.</desc>

  <style>
    :root {
      --bg:#ffffff; --fg:#1f2328; --muted:#57606a; --line:#d0d7de;
      --accent:#0969da; --panel:#f6f8fa;
      --out:#cf222e; --outbg:#fdeceb; --in:#1a7f37; --inbg:#e8f5ec;
      --wait:#57606a; --waitbg:#ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d;
        --accent:#58a6ff; --panel:#161b22;
        --out:#f85149; --outbg:#2b1416; --in:#3fb950; --inbg:#10261a;
        --wait:#8b949e; --waitbg:#0d1117; }
    }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--fg); }
    .lab  { font-size:14px; font-weight:700; letter-spacing:1.4px; fill:var(--accent); }
    .cap  { font-size:13px; font-weight:700; letter-spacing:1.2px; fill:var(--muted); }
    .item { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:20px; font-weight:700; }
    .edge { font-size:13px; font-weight:700; }
    .note { font-size:13.5px; fill:var(--muted); }
    .step { font-size:14px; }
    .box  { fill:var(--waitbg); stroke:var(--wait); stroke-width:2; }
    .box.o { fill:var(--outbg); stroke:var(--out); }
    .box.i { fill:var(--inbg);  stroke:var(--in); }
    .slot { fill:none; stroke:var(--in); stroke-width:2; stroke-dasharray:5 4; }
    .rail { stroke:var(--line); stroke-width:1.8; fill:var(--panel); }
    .arr  { stroke-width:2.5; fill:none; stroke-linecap:round; }
  </style>

  <defs>
    <marker id="f-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--out)"/>
    </marker>
    <marker id="f-in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--in)"/>
    </marker>
  </defs>

  <rect width="960" height="410" rx="18" fill="var(--bg)"/>
  <text class="lab" x="30" y="36">BFS &#183; FIFO &#8212; FIRST IN, FIRST OUT</text>

  <!-- row 1 -->
  <text class="cap" x="30" y="76">FRONTIER NOW</text>

  <text class="edge" x="88" y="106" text-anchor="middle" fill="var(--out)">REMOVE HERE</text>
  <line class="arr" x1="88" y1="116" x2="88" y2="140" stroke="var(--out)" marker-end="url(#f-out)"/>

  <text class="edge" x="456" y="106" text-anchor="middle" fill="var(--in)">ADD HERE</text>
  <line class="arr" x1="456" y1="116" x2="456" y2="140" stroke="var(--in)" marker-end="url(#f-in)"/>

  <rect class="rail" x="30" y="146" width="520" height="76" rx="12"/>
  <rect class="box o" x="48"  y="162" width="80" height="44" rx="9"/>
  <text class="item" x="88"  y="192" text-anchor="middle" fill="var(--out)">A</text>
  <rect class="box" x="140" y="162" width="80" height="44" rx="9"/>
  <text class="item" x="180" y="192" text-anchor="middle">B</text>
  <rect class="box" x="232" y="162" width="80" height="44" rx="9"/>
  <text class="item" x="272" y="192" text-anchor="middle">C</text>
  <rect class="box" x="324" y="162" width="80" height="44" rx="9"/>
  <text class="item" x="364" y="192" text-anchor="middle">D</text>
  <rect class="slot" x="416" y="162" width="80" height="44" rx="9"/>

  <text class="note" x="30" y="248">waited longest &#8592;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8594; waited least</text>

  <text class="step" x="590" y="180">A leaves first because it has</text>
  <text class="step" x="590" y="200">waited the longest, not because</text>
  <text class="step" x="590" y="220">anything says it looks better.</text>

  <!-- row 2 -->
  <text class="cap" x="30" y="292">AFTER EXPANDING A, WHICH GENERATES E AND F</text>

  <rect class="rail" x="30" y="308" width="520" height="76" rx="12"/>
  <rect class="box" x="48"  y="324" width="80" height="44" rx="9"/>
  <text class="item" x="88"  y="354" text-anchor="middle">B</text>
  <rect class="box" x="140" y="324" width="80" height="44" rx="9"/>
  <text class="item" x="180" y="354" text-anchor="middle">C</text>
  <rect class="box" x="232" y="324" width="80" height="44" rx="9"/>
  <text class="item" x="272" y="354" text-anchor="middle">D</text>
  <rect class="box i" x="324" y="324" width="80" height="44" rx="9"/>
  <text class="item" x="364" y="354" text-anchor="middle" fill="var(--in)">E</text>
  <rect class="box i" x="416" y="324" width="80" height="44" rx="9"/>
  <text class="item" x="456" y="354" text-anchor="middle" fill="var(--in)">F</text>

  <text class="step" x="590" y="338">E and F are children of the state</text>
  <text class="step" x="590" y="358">just expanded, and they still</text>
  <text class="step" x="590" y="378">queue behind B, C and D.</text>
</svg>

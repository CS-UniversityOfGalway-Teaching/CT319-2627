<svg xmlns="http://www.w3.org/2000/svg" width="960" height="444" viewBox="0 0 960 444" role="img" aria-labelledby="title desc">
  <title id="title">Depth-first expansion order on the same small tree</title>
  <desc id="desc">The same tree as the breadth-first figure: root S, three children A, B and C, and five grandchildren. Each node carries the order in which depth-first search expands it. S is first, then C and its only child H, then B with G and F, then A with E and D. The stack hands back the most recently added state, so the search drives to a leaf before returning to the alternatives left waiting.</desc>

  <style>
    :root {
      --bg:#ffffff; --fg:#1f2328; --muted:#57606a; --line:#d0d7de;
      --accent:#0969da; --panel:#f6f8fa; --card:#ffffff;
      --frontier:#8250df; --frontierbg:#f5eeff;
      --current:#9a6700;  --currentbg:#fff8c5;
      --done:#57606a;     --donebg:#eaeef2;
      --goal:#1a7f37;     --goalbg:#dafbe1;
      --bad:#cf222e;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d;
        --accent:#58a6ff; --panel:#161b22; --card:#0d1117;
        --frontier:#a371f7; --frontierbg:#1d162b;
        --current:#d29922;  --currentbg:#2b2413;
        --done:#8b949e;     --donebg:#161b22;
        --goal:#3fb950;     --goalbg:#0f2916;
        --bad:#f85149; }
    }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--fg); }
    .lab  { font-size:14px; font-weight:700; letter-spacing:1.4px; fill:var(--accent); }
    .note { font-size:14px; fill:var(--muted); }
    .cap  { font-size:12.5px; fill:var(--muted); }
    .node { font-size:17px; font-weight:700; }
    .ord  { font-size:12px; font-weight:700; fill:var(--muted); }
    .circ { fill:var(--card); stroke:var(--line); stroke-width:2.2; }
    .circG{ fill:var(--goalbg); stroke:var(--goal); stroke-width:2.8; }
    .circS{ fill:var(--panel); stroke:var(--accent); stroke-width:2.8; }
    .edge { stroke:var(--muted); stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .edgeBad { stroke:var(--bad); stroke-width:2.4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .box  { fill:var(--card); stroke:var(--line); stroke-width:1.8; }
    .boxA { fill:var(--panel); stroke:var(--accent); stroke-width:2.2; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; }
  </style>

  <rect width="960" height="444" rx="18" fill="var(--bg)"/>
  <text class="lab" x="30" y="38">DEPTH-FIRST EXPANSION ORDER · THE SAME TREE</text>
  <path d="M120 78 H900" stroke="var(--line)" stroke-width="1.2" stroke-dasharray="3 7" fill="none"/>
  <text class="cap" x="34" y="83">depth 0</text>
  <path d="M120 196 H900" stroke="var(--line)" stroke-width="1.2" stroke-dasharray="3 7" fill="none"/>
  <text class="cap" x="34" y="201">depth 1</text>
  <path d="M120 330 H900" stroke="var(--line)" stroke-width="1.2" stroke-dasharray="3 7" fill="none"/>
  <text class="cap" x="34" y="335">depth 2</text>
  <path class="edge" d="M449 93 L271 181"/>
  <path class="edge" d="M285 183 L271 181 L278 168"/>
  <path class="edge" d="M480 112 L480 162"/>
  <path class="edge" d="M488 149 L480 162 L472 149"/>
  <path class="edge" d="M511 93 L689 181"/>
  <path class="edge" d="M682 168 L689 181 L675 183"/>
  <path class="edge" d="M223 225 L176 303"/>
  <path class="edge" d="M190 296 L176 303 L176 288"/>
  <path class="edge" d="M257 225 L304 303"/>
  <path class="edge" d="M304 288 L304 303 L290 296"/>
  <path class="edge" d="M463 225 L416 303"/>
  <path class="edge" d="M430 296 L416 303 L416 288"/>
  <path class="edge" d="M497 225 L544 303"/>
  <path class="edge" d="M544 288 L544 303 L530 296"/>
  <path class="edge" d="M720 230 L720 298"/>
  <path class="edge" d="M728 285 L720 298 L712 285"/>
  <circle class="circS" cx="480" cy="78" r="34"/>
  <text class="node" x="480" y="84" text-anchor="middle" style="font-size:15px">S · 1</text>
  <circle class="circ" cx="240" cy="196" r="34"/>
  <text class="node" x="240" y="202" text-anchor="middle" style="font-size:15px">A · 7</text>
  <circle class="circ" cx="480" cy="196" r="34"/>
  <text class="node" x="480" y="202" text-anchor="middle" style="font-size:15px">B · 4</text>
  <circle class="circ" cx="720" cy="196" r="34"/>
  <text class="node" x="720" y="202" text-anchor="middle" style="font-size:15px">C · 2</text>
  <circle class="circ" cx="160" cy="330" r="32"/>
  <text class="node" x="160" y="336" text-anchor="middle" style="font-size:14px">D · 9</text>
  <circle class="circ" cx="320" cy="330" r="32"/>
  <text class="node" x="320" y="336" text-anchor="middle" style="font-size:14px">E · 8</text>
  <circle class="circ" cx="400" cy="330" r="32"/>
  <text class="node" x="400" y="336" text-anchor="middle" style="font-size:14px">F · 6</text>
  <circle class="circ" cx="560" cy="330" r="32"/>
  <text class="node" x="560" y="336" text-anchor="middle" style="font-size:14px">G · 5</text>
  <circle class="circ" cx="720" cy="330" r="32"/>
  <text class="node" x="720" y="336" text-anchor="middle" style="font-size:14px">H · 3</text>
  <text class="note" x="30" y="418">The search reaches depth 2 before it has finished depth 1. The number in each node is expansion order.</text>
</svg>

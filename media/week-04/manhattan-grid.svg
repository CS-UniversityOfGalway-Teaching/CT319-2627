<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc"><title id="title">Manhattan distance on the CT319 maze</title><desc id="desc">Actual crop of rows 4 to 6 and columns 6 to 8. Current cell 4,7 and goal 6,8 differ by two rows and one column. A dashed right-then-down geometric route crosses wall 5,8; the formula ignores that wall. Other walls in the crop are 5,6.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#1f2328} .title{font-size:27px;font-weight:700} .label{font-size:22px;font-weight:600} .body{font-size:20px} .small{font-size:18px;fill:#57606a} .mono{font-family:ui-monospace,Menlo,monospace;font-size:25px;font-weight:700}</style><rect width="100%" height="100%" fill="#fff"/><text x="30" y="42" class="title">MANHATTAN DISTANCE · COUNT COORDINATE DIFFERENCES</text><text x="118" y="91" class="small">6</text><text x="223" y="91" class="small">7</text><text x="328" y="91" class="small">8</text><text x="42" y="151" class="small">4</text><rect x="80" y="107" width="100" height="100" rx="5" fill="#f6f8fa" stroke="#8c959f"/><text x="95" y="138" class="small">(4,6)</text><rect x="185" y="107" width="100" height="100" rx="5" fill="#fff8c5" stroke="#8c959f"/><text x="200" y="138" class="small">(4,7)</text><text x="194" y="186" class="body">current</text><rect x="290" y="107" width="100" height="100" rx="5" fill="#f6f8fa" stroke="#8c959f"/><text x="305" y="138" class="small">(4,8)</text><text x="42" y="256" class="small">5</text><rect x="80" y="212" width="100" height="100" rx="5" fill="#57606a" stroke="#8c959f"/><text x="96" y="272" style="fill:white;font-size:20px">WALL</text><rect x="185" y="212" width="100" height="100" rx="5" fill="#f6f8fa" stroke="#8c959f"/><text x="200" y="243" class="small">(5,7)</text><rect x="290" y="212" width="100" height="100" rx="5" fill="#57606a" stroke="#8c959f"/><text x="306" y="272" style="fill:white;font-size:20px">WALL</text><text x="42" y="361" class="small">6</text><rect x="80" y="317" width="100" height="100" rx="5" fill="#f6f8fa" stroke="#8c959f"/><text x="95" y="348" class="small">(6,6)</text><rect x="185" y="317" width="100" height="100" rx="5" fill="#f6f8fa" stroke="#8c959f"/><text x="200" y="348" class="small">(6,7)</text><rect x="290" y="317" width="100" height="100" rx="5" fill="#dafbe1" stroke="#8c959f"/><text x="305" y="348" class="small">(6,8)</text><text x="314" y="393" class="label">goal</text><path d="M235 157 H340 V367" fill="none" stroke="#0969da" stroke-width="4" stroke-dasharray="8 6"/><path d="M235 100 V96 H340 V100 M404 157 H415 V367 H404" fill="none" stroke="#0969da" stroke-width="3"/><text x="475" y="137" class="label">Vertical difference</text><text x="475" y="174" class="mono">|4 − 6| = 2 moves</text><text x="475" y="227" class="label">Horizontal difference</text><text x="475" y="264" class="mono">|7 − 8| = 1 move</text><text x="475" y="322" class="mono">h(4,7) = 2 + 1 = 3</text><text x="475" y="372" class="body">The formula ignores the wall.</text><text x="475" y="402" class="body">The dashed route is not legal.</text><text x="30" y="467" class="label">Without walls: exact cost. With walls: a detour may be needed.</text></svg>
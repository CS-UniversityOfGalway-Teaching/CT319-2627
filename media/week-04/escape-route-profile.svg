<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="t d">
  <title id="t">The heuristic profile of the shortest route out of the trap at (4,8)</title>
  <desc id="d">A profile of h along the four-move route (4,8) to (4,7) to (5,7) to (6,7) to (6,8), with h values 2, 3, 2, 1, 0. The first move raises h from 2 to 3 and is marked rejected; the remaining three moves all lower h and are marked accepted. Strict hill climbing refuses the first move, so it never reaches the three that follow.</desc>
  <style>
    :root {
      --bg:#ffffff; --fg:#1f2328; --muted:#57606a; --line:#d0d7de;
      --accent:#0969da; --panel:#f6f8fa; --card:#ffffff;
      --goal:#1a7f37; --goalbg:#dafbe1;
      --bad:#cf222e;  --badbg:#ffebe9;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d;
        --accent:#58a6ff; --panel:#161b22; --card:#0d1117;
        --goal:#3fb950; --goalbg:#0f2916;
        --bad:#f85149;  --badbg:#2b1113; }
    }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--fg); }
    .lab  { font-size:14px; font-weight:700; letter-spacing:1.4px; fill:var(--accent); }
    .axis { font-size:13px; font-weight:600; fill:var(--muted); }
    .st   { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:15px; font-weight:700; }
    .role { font-size:12.5px; fill:var(--muted); }
    .hval { font-size:15px; font-weight:700; fill:var(--fg); }
    .callBad  { font-size:15px; font-weight:700; fill:var(--bad); }
    .callGood { font-size:15px; font-weight:700; fill:var(--goal); }
    .foot { font-size:14px; fill:var(--muted); }
    .grid { stroke:var(--line); stroke-width:1.2; stroke-dasharray:3 7; fill:none; }
    .drop { stroke:var(--line); stroke-width:1.2; fill:none; }
    .segBad  { stroke:var(--bad);  stroke-width:3.6; fill:none; stroke-linecap:round; }
    .segGood { stroke:var(--goal); stroke-width:3.2; fill:none; stroke-linecap:round; }
    .mk   { fill:var(--card);   stroke:var(--line); stroke-width:2.4; }
    .mkT  { fill:var(--badbg);  stroke:var(--bad);  stroke-width:3; }
    .mkG  { fill:var(--goalbg); stroke:var(--goal); stroke-width:3; }
  </style>

  <rect width="960" height="460" rx="18" fill="var(--bg)"/>
  <text class="lab" x="30" y="38">THE WAY OUT OF (4,8) &#183; h ALONG THE SHORTEST REMAINING ROUTE</text>

  <path class="grid" d="M130 120 H900"/><text class="axis" x="118" y="125" text-anchor="end">h = 3</text>
  <path class="grid" d="M130 190 H900"/><text class="axis" x="118" y="195" text-anchor="end">h = 2</text>
  <path class="grid" d="M130 260 H900"/><text class="axis" x="118" y="265" text-anchor="end">h = 1</text>
  <path class="grid" d="M130 330 H900"/><text class="axis" x="118" y="335" text-anchor="end">h = 0</text>

  <path class="drop" d="M150 190 V352"/>
  <path class="drop" d="M320 120 V352"/>
  <path class="drop" d="M490 190 V352"/>
  <path class="drop" d="M660 260 V352"/>
  <path class="drop" d="M830 330 V352"/>

  <path class="segBad"  d="M150 190 L320 120"/>
  <path class="segGood" d="M320 120 L490 190 L660 260 L830 330"/>

  <text class="callBad"  x="168" y="92">MOVE 1 REJECTED &#183; h rises 2 &#8594; 3</text>
  <text class="callGood" x="520" y="158">moves 2, 3 and 4 all improve h</text>
  <text class="role"     x="150" y="152" text-anchor="middle">strict rule stops here</text>

  <circle class="mkT" cx="150" cy="190" r="15"/><text class="hval" x="150" y="196" text-anchor="middle">2</text>
  <circle class="mk"  cx="320" cy="120" r="15"/><text class="hval" x="320" y="126" text-anchor="middle">3</text>
  <circle class="mk"  cx="490" cy="190" r="15"/><text class="hval" x="490" y="196" text-anchor="middle">2</text>
  <circle class="mk"  cx="660" cy="260" r="15"/><text class="hval" x="660" y="266" text-anchor="middle">1</text>
  <circle class="mkG" cx="830" cy="330" r="15"/><text class="hval" x="830" y="336" text-anchor="middle">0</text>

  <text class="st" x="150" y="380" text-anchor="middle">(4,8)</text>
  <text class="st" x="320" y="380" text-anchor="middle">(4,7)</text>
  <text class="st" x="490" y="380" text-anchor="middle">(5,7)</text>
  <text class="st" x="660" y="380" text-anchor="middle">(6,7)</text>
  <text class="st" x="830" y="380" text-anchor="middle">(6,8)</text>

  <text class="role" x="150" y="402" text-anchor="middle">local minimum</text>
  <text class="role" x="830" y="402" text-anchor="middle">goal</text>

  <path d="M30 424 H930" stroke="var(--line)" stroke-width="1.2" fill="none"/>
  <text class="foot" x="30" y="447">A four-move route to the goal exists. The rule will not take the first step, so it never reaches the three that follow.</text>
</svg>

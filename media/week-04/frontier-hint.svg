<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">What information did blind search lack?</title><desc id="desc">Frontier in insertion order: A, oldest, h 9; B, h 4; C, newest, h 7. BFS chooses A and DFS chooses C. The heuristic ranks B as most promising, but does not change BFS or DFS.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#1f2328} .title{font-size:27px;font-weight:700} .label{font-size:22px;font-weight:600} .body{font-size:20px} .small{font-size:18px;fill:#57606a} .mono{font-family:ui-monospace,Menlo,monospace;font-size:25px;font-weight:700}</style><rect width="100%" height="100%" fill="#fff"/><text x="35" y="43" class="title">SAME FRONTIER · NEW INFORMATION</text><text x="35" y="80" class="small">Insertion order: oldest → newest</text><rect x="35" y="104" width="280" height="150" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/><text x="60" y="144" class="title">A</text><text x="60" y="187" class="mono">h = 9</text><text x="60" y="230" class="small">oldest</text><rect x="340" y="104" width="280" height="150" rx="12" fill="#e8f5ec" stroke="#1a7f37" stroke-width="2"/><text x="365" y="144" class="title">B</text><text x="365" y="187" class="mono">h = 4</text><text x="365" y="230" class="small">middle</text><rect x="645" y="104" width="280" height="150" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/><text x="670" y="144" class="title">C</text><text x="670" y="187" class="mono">h = 7</text><text x="670" y="230" class="small">newest</text><text x="35" y="302" class="label">WEEK 3 · waiting order</text><text x="35" y="337" class="body">BFS: A (oldest) · DFS: C (newest)</text><text x="500" y="302" class="label">WEEK 4 · estimated promise</text><text x="500" y="337" class="body">B looks best: h = 4 is lowest.</text><text x="35" y="390" class="body">The score gives guidance. A strategy must read it to use it.</text></svg>
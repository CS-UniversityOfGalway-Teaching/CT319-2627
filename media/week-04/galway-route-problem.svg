<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="492" viewBox="0 0 1120 492" role="img" aria-labelledby="t d">
  <title id="t">The UHG to Merlin Park route problem</title>
  <desc id="d">A weighted graph of fifteen junctions labelled A to S. The start O is University Hospital Galway and the goal D is Merlin Park University Hospital. Seventeen roads carry a cost each: A-B 3, A-C 1, B-C 3, C-O 1, O-E 2, O-F 2, F-G 1, G-I 5, G-L 2, I-J 4, J-N 5, L-N 5, N-Q 4, N-S 15, Q-R 1, R-S 6, S-D 7. Four routes reach D. Nothing in the diagram says which search algorithm should be used to find one.</desc>
  <style>
    :root {
      --bg:#ffffff; --fg:#1f2328; --muted:#57606a; --line:#d0d7de;
      --accent:#0969da; --panel:#f6f8fa; --card:#ffffff;
      --good:#1a7f37; --goodbg:#dafbe1; --bad:#cf222e;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d;
        --accent:#58a6ff; --panel:#161b22; --card:#0d1117;
        --good:#3fb950; --goodbg:#0f2916; --bad:#f85149; }
    }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--fg); }
    .lab  { font-size:14px; font-weight:700; letter-spacing:1.4px; fill:var(--accent); }
    .note { font-size:13.5px; fill:var(--muted); }
    .nd   { font-size:14px; font-weight:700; text-anchor:middle; }
    .place{ font-size:12.5px; font-weight:700; }
    .wt   { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; font-weight:700; fill:var(--fg); text-anchor:middle; }
    .road { stroke:var(--muted); stroke-width:2.4; fill:none; stroke-linecap:round; }
    .node { fill:var(--panel); stroke:var(--line); stroke-width:2; }
    .start{ fill:var(--panel); stroke:var(--accent); stroke-width:3.2; }
    .goal { fill:var(--goodbg); stroke:var(--good); stroke-width:3.2; }
    .chip { fill:var(--bg); }
  </style>
  <rect width="1120" height="492" rx="18" fill="var(--bg)"/>
  <text class="lab" x="30" y="40">TRANSFER A PATIENT FROM UHG TO MERLIN PARK &#183; WHICH ALGORITHM WOULD YOU CHOOSE?</text>
  <text class="note" x="30" y="63">Every road carries a cost. Start at O. Reach D.</text>

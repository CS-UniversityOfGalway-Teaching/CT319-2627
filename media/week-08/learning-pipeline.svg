<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="330" viewBox="0 0 1040 330" role="img" aria-labelledby="t d">
  <title id="t">Past examples build a model; the model handles new cases</title>
  <desc id="d">Past examples feed a learning algorithm, which produces a model. A new example, which was never part of the training data, is given to that same model, and the model returns a prediction or decision.</desc>
  <style>
    :root { --bg:#ffffff; --fg:#1f2328; --muted:#57606a; --line:#d0d7de;
      --accent:#0969da; --panel:#f6f8fa; --accentbg:#ddf4ff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d;
        --accent:#58a6ff; --panel:#161b22; --accentbg:#0c2d6b; } }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--fg); }
    .lab  { font-size:14px; font-weight:700; letter-spacing:1.4px; fill:var(--accent); }
    .node { font-size:16px; font-weight:700; text-anchor:middle; }
    .edge { font-size:13px; fill:var(--muted); text-anchor:middle; font-style:italic; }
    .note { font-size:13.5px; fill:var(--muted); }
    .box  { fill:var(--panel); stroke:var(--line); stroke-width:2; }
    .box--key { fill:var(--accentbg); stroke:var(--accent); stroke-width:2.4; }
    .arr  { stroke:var(--muted); stroke-width:2.4; fill:none; marker-end:url(#a); }
  </style>
  <rect width="1040" height="330" rx="18" fill="var(--bg)"/>
  <text class="lab" x="30" y="42">PAST DATA BUILDS THE MODEL &#183; THE MODEL MEETS THE NEW CASE</text>

  <rect class="box" x="40" y="90" width="200" height="60" rx="10"/>
  <text class="node" x="140" y="127">PAST EXAMPLES</text>

  <path class="arr" d="M244 120 H284"/>
  <text class="edge" x="264" y="108">train</text>

  <rect class="box" x="290" y="90" width="240" height="60" rx="10"/>
  <text class="node" x="410" y="127">LEARNING ALGORITHM</text>

  <path class="arr" d="M534 120 H574"/>
  <text class="edge" x="554" y="108">produces</text>

  <rect class="box box--key" x="580" y="90" width="170" height="60" rx="10"/>
  <text class="node" x="665" y="127">MODEL</text>

  <path class="arr" d="M754 120 H794"/>

  <rect class="box" x="800" y="90" width="200" height="60" rx="10"/>
  <text class="node" x="900" y="115">PREDICTION</text>
  <text class="node" x="900" y="137">OR DECISION</text>

  <rect class="box" x="290" y="220" width="200" height="60" rx="10"/>
  <text class="node" x="390" y="257">NEW EXAMPLE</text>

  <path class="arr" d="M494 250 H665 V158"/>
  <text class="edge" x="570" y="238">never seen during training</text>

  <text class="note" x="30" y="308">The learning algorithm is the procedure. The model is what it produces &#8212; and the only part that meets a case nobody has labelled.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/>
    </marker>
  </defs>
</svg>

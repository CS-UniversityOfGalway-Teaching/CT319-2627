<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">ELIZA behaviour and mechanism</title>
  <desc id="desc">A two-stage diagram showing the observed behaviour of ELIZA above the mechanism that produces it.</desc>

  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #57606a;
      --line: #d0d7de;
      --accent: #0969da;
      --panel: #f6f8fa;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #8b949e;
        --line: #30363d;
        --accent: #58a6ff;
        --panel: #161b22;
      }
    }

    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      fill: var(--fg);
    }

    .label {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 1.8px;
      fill: var(--accent);
    }

    .main {
      font-size: 25px;
      font-weight: 600;
    }

    .sub {
      font-size: 17px;
      fill: var(--muted);
    }

    .panel {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 1.5;
    }

    .connector {
      stroke: var(--muted);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
    }
  </style>

  <rect width="960" height="360" rx="18" fill="var(--bg)"/>

  <rect class="panel" x="120" y="40" width="720" height="110" rx="14"/>
  <text class="label" x="155" y="78">BEHAVIOUR</text>
  <text class="main" x="155" y="116">“This program seems to be listening to me”</text>

  <line class="connector" x1="480" y1="158" x2="480" y2="201"/>
  <path class="connector" d="M470 191 L480 202 L490 191"/>

  <rect class="panel" x="120" y="210" width="720" height="110" rx="14"/>
  <text class="label" x="155" y="248">MECHANISM</text>
  <text class="main" x="155" y="286">keyword ranking + decomposition + reassembly + script</text>

  <text class="sub" x="480" y="345" text-anchor="middle">The behaviour is visible; the mechanism has to be inspected.</text>
</svg>

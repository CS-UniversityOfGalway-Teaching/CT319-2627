<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="420" viewBox="0 0 1210 420" role="img" aria-labelledby="title desc">
  <title id="title">The complete safe state space for Farmer Jones</title>
  <desc id="desc">All ten safe states, drawn as nodes, with an edge wherever one legal crossing turns one state into another. The start state SSSS is at the left and the goal state NNNN at the right.</desc>
  <style>
    :root {
      --bg:#ffffff; --fg:#1f2328; --muted:#57606a; --line:#d0d7de;
      --accent:#0969da; --panel:#f6f8fa; --card:#ffffff; --good:#1a7f37; --dim:#8c959f;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d;
        --accent:#58a6ff; --panel:#161b22; --card:#0d1117; --good:#3fb950; --dim:#6e7681; }
    }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--fg); }
    .node { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:17px; font-weight:700; }
    .edge { stroke:var(--muted); stroke-width:2; fill:none; }
    .edgedim { stroke:var(--dim); stroke-width:1.5; fill:none; opacity:.45; }
    .edgeon { stroke:var(--accent); stroke-width:4; fill:none; stroke-linecap:round; }
    .elabel { font-size:13px; fill:var(--muted); }
    .elabeldim { font-size:13px; fill:var(--dim); opacity:.55; }
    .elabelon { font-size:13px; font-weight:700; fill:var(--accent); }
    .box { fill:var(--card); stroke:var(--line); stroke-width:1.8; }
    .boxdim { fill:var(--card); stroke:var(--line); stroke-width:1.5; opacity:.5; }
    .boxon { fill:var(--card); stroke:var(--accent); stroke-width:3; }
    .boxstart { fill:var(--card); stroke:var(--accent); stroke-width:3; }
    .boxgoal { fill:var(--card); stroke:var(--good); stroke-width:3; }
    .tag { font-size:12px; font-weight:700; letter-spacing:1.4px; }
    .legend { font-size:14px; fill:var(--muted); }
    .step { font-size:12px; font-weight:700; fill:var(--accent); }
  </style>
  <rect width="1210" height="420" rx="18" fill="var(--bg)"/>

  <line class="edge" x1="95" y1="215" x2="235" y2="215"/>
  <rect x="135" y="204" width="60" height="19" rx="5" fill="var(--bg)"/>
  <text class="elabel" x="165" y="218" text-anchor="middle">Goat</text>
  <line class="edge" x1="235" y1="215" x2="375" y2="215"/>
  <rect x="275" y="204" width="60" height="19" rx="5" fill="var(--bg)"/>
  <text class="elabel" x="305" y="218" text-anchor="middle">Self</text>
  <line class="edge" x1="375" y1="215" x2="535" y2="130"/>
  <rect x="425" y="161" width="60" height="19" rx="5" fill="var(--bg)"/>
  <text class="elabel" x="455" y="175" text-anchor="middle">Wolf</text>
  <line class="edge" x1="375" y1="215" x2="535" y2="300"/>
  <rect x="425" y="246" width="60" height="19" rx="5" fill="var(--bg)"/>
  <text class="elabel" x="455" y="260" text-anchor="middle">Cabbage</text>
  <line class="edge" x1="535" y1="130" x2="695" y2="130"/>
  <rect x="585" y="119" width="60" height="19" rx="5" fill="var(--bg)"/>
  <text class="elabel" x="615" y="133" text-anchor="middle">Goat</text>
  <line class="edge" x1="535" y1="300" x2="695" y2="300"/>
  <rect x="585" y="289" width="60" height="19" rx="5" fill="var(--bg)"/>
  <text class="elabel" x="615" y="303" text-anchor="middle">Goat</text>
  <line class="edge" x1="695" y1="130" x2="855" y2="215"/>
  <rect x="745" y="161" width="60" height="19" rx="5" fill="var(--bg)"/>
  <text class="elabel" x="775" y="175" text-anchor="middle">Cabbage</text>
  <line class="edge" x1="695" y1="300" x2="855" y2="215"/>
  <rect x="745" y="246" width="60" height="19" rx="5" fill="var(--bg)"/>
  <text class="elabel" x="775" y="260" text-anchor="middle">Wolf</text>
  <line class="edge" x1="855" y1="215" x2="995" y2="215"/>
  <rect x="895" y="204" width="60" height="19" rx="5" fill="var(--bg)"/>
  <text class="elabel" x="925" y="218" text-anchor="middle">Self</text>
  <line class="edge" x1="995" y1="215" x2="1115" y2="215"/>
  <rect x="1025" y="204" width="60" height="19" rx="5" fill="var(--bg)"/>
  <text class="elabel" x="1055" y="218" text-anchor="middle">Goat</text>
  <rect class="boxstart" x="51" y="196" width="88" height="38" rx="9"/>
  <text class="node" x="95" y="221" text-anchor="middle">SSSS</text>
  <rect class="box" x="191" y="196" width="88" height="38" rx="9"/>
  <text class="node" x="235" y="221" text-anchor="middle">NSNS</text>
  <rect class="box" x="331" y="196" width="88" height="38" rx="9"/>
  <text class="node" x="375" y="221" text-anchor="middle">SSNS</text>
  <rect class="box" x="491" y="111" width="88" height="38" rx="9"/>
  <text class="node" x="535" y="136" text-anchor="middle">NNNS</text>
  <rect class="box" x="491" y="281" width="88" height="38" rx="9"/>
  <text class="node" x="535" y="306" text-anchor="middle">NSNN</text>
  <rect class="box" x="651" y="111" width="88" height="38" rx="9"/>
  <text class="node" x="695" y="136" text-anchor="middle">SNSS</text>
  <rect class="box" x="651" y="281" width="88" height="38" rx="9"/>
  <text class="node" x="695" y="306" text-anchor="middle">SSSN</text>
  <rect class="box" x="811" y="196" width="88" height="38" rx="9"/>
  <text class="node" x="855" y="221" text-anchor="middle">NNSN</text>
  <rect class="box" x="951" y="196" width="88" height="38" rx="9"/>
  <text class="node" x="995" y="221" text-anchor="middle">SNSN</text>
  <rect class="boxgoal" x="1071" y="196" width="88" height="38" rx="9"/>
  <text class="node" x="1115" y="221" text-anchor="middle">NNNN</text>
  <text class="tag" x="95" y="185" text-anchor="middle" fill="var(--accent)">START</text>
  <text class="tag" x="1115" y="185" text-anchor="middle" fill="var(--good)">GOAL</text>
  <text class="legend" x="30" y="386">Tuple order: (Farmer, Wolf, Goat, Cabbage) &#183; S = south bank, N = north bank</text>
  <text class="legend" x="30" y="408">Each edge is one legal crossing; the label names who travels with the farmer. &#8220;Self&#8221; means the farmer crosses alone.</text>
</svg>

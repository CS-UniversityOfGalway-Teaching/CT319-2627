  <text class="legend" x="30" y="518">@ = the current state &#183; green = a legal next state &#183; red = rejected by the constraints &#183; filled = wall.</text>
  <text class="legend" x="30" y="542">The four move vectors are tried from every state; only the ones landing on an open cell inside the grid survive.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" role="img" aria-labelledby="title desc">
  <title id="title">From an unstructured situation to a searchable problem</title>
  <desc id="desc">A six-stage pipeline. A messy real-world situation leads to choosing the question, identifying the relevant information, a representation, and then states, actions and constraints. Only the sixth stage, a searchable problem, is something a machine can act on; the first five are decisions a person has to make.</desc>

  <style>
    :root {
      --bg:#ffffff; --fg:#1f2328; --muted:#57606a; --line:#d0d7de;
      --accent:#0969da; --panel:#f6f8fa; --card:#ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d;
        --accent:#58a6ff; --panel:#161b22; --card:#0d1117; }
    }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--fg); }
    .lab { font-size:14px; font-weight:700; letter-spacing:1.4px; fill:var(--accent); }
    .num { font-size:12px; font-weight:700; letter-spacing:1px; fill:var(--muted); }
    .body { font-size:13px; font-weight:600; }
    .who { font-size:13px; fill:var(--muted); }
    .whoacc { font-size:13px; font-weight:700; fill:var(--accent); }
    .card { fill:var(--card); stroke:var(--line); stroke-width:1.8; }
    .cardlast { fill:var(--panel); stroke:var(--accent); stroke-width:2.2; stroke-dasharray:6 4; }
    .connector { stroke:var(--muted); stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .brace { stroke:var(--line); stroke-width:1.8; fill:none; stroke-linejoin:round; }
    .braceacc { stroke:var(--accent); stroke-width:1.8; fill:none; stroke-linejoin:round; }
  </style>

  <rect width="960" height="290" rx="18" fill="var(--bg)"/>
  <text class="lab" x="24" y="34">FROM AN UNSTRUCTURED SITUATION TO A SEARCHABLE PROBLEM</text>

  <!-- 1 -->
  <rect class="card" x="24" y="58" width="132" height="128" rx="12"/>
  <text class="num" x="90" y="86" text-anchor="middle">1</text>
  <text class="body" x="90" y="128" text-anchor="middle">Messy real-world</text>
  <text class="body" x="90" y="147" text-anchor="middle">situation</text>

  <!-- 2 -->
  <rect class="card" x="180" y="58" width="132" height="128" rx="12"/>
  <text class="num" x="246" y="86" text-anchor="middle">2</text>
  <text class="body" x="246" y="128" text-anchor="middle">Choose the</text>
  <text class="body" x="246" y="147" text-anchor="middle">question</text>

  <!-- 3 -->
  <rect class="card" x="336" y="58" width="132" height="128" rx="12"/>
  <text class="num" x="402" y="86" text-anchor="middle">3</text>
  <text class="body" x="402" y="119" text-anchor="middle">Identify the</text>
  <text class="body" x="402" y="138" text-anchor="middle">relevant</text>
  <text class="body" x="402" y="157" text-anchor="middle">information</text>

  <!-- 4 -->
  <rect class="card" x="492" y="58" width="132" height="128" rx="12"/>
  <text class="num" x="558" y="86" text-anchor="middle">4</text>
  <text class="body" x="558" y="138" text-anchor="middle">Representation</text>

  <!-- 5 -->
  <rect class="card" x="648" y="58" width="132" height="128" rx="12"/>
  <text class="num" x="714" y="86" text-anchor="middle">5</text>
  <text class="body" x="714" y="128" text-anchor="middle">States, actions</text>
  <text class="body" x="714" y="147" text-anchor="middle">and constraints</text>

  <!-- 6 -->
  <rect class="cardlast" x="804" y="58" width="132" height="128" rx="12"/>
  <text class="num" x="870" y="86" text-anchor="middle">6</text>
  <text class="body" x="870" y="128" text-anchor="middle">Searchable</text>
  <text class="body" x="870" y="147" text-anchor="middle">problem</text>

  <!-- connectors -->
  <path class="connector" d="M158 122 H172"/>
  <path class="connector" d="M168 117 L174 122 L168 127"/>
  <path class="connector" d="M314 122 H328"/>
  <path class="connector" d="M324 117 L330 122 L324 127"/>
  <path class="connector" d="M470 122 H484"/>
  <path class="connector" d="M480 117 L486 122 L480 127"/>
  <path class="connector" d="M626 122 H640"/>
  <path class="connector" d="M636 117 L642 122 L636 127"/>
  <path class="connector" d="M782 122 H796"/>
  <path class="connector" d="M792 117 L798 122 L792 127"/>

  <!-- who does what -->
  <path class="brace" d="M24 198 V210 H780 V198"/>
  <text class="who" x="402" y="236" text-anchor="middle">every one of these is a decision a person makes — this is Week 2</text>

  <path class="braceacc" d="M804 198 V210 H936 V198"/>
  <text class="whoacc" x="870" y="232" text-anchor="middle">what the machine</text>
  <text class="whoacc" x="870" y="249" text-anchor="middle">can finally act on</text>
</svg>

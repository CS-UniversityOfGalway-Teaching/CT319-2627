<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">The same cell, two different states</title>
  <desc id="desc">The agent stands at row 4 column 3 in both panels. Without the key the locked door below is not a legal move; with the key it is. The position is identical, so position alone cannot be the whole state.</desc>

  <style>
    :root {
      --bg:#ffffff; --fg:#1f2328; --muted:#57606a; --line:#d0d7de;
      --accent:#0969da; --panel:#f6f8fa; --card:#ffffff;
      --wall:#57606a; --good:#1a7f37; --bad:#cf222e;
      --goodbg:#e8f5ec; --badbg:#fdeceb; --accbg:#ddeeff; --door:#8250df;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d;
        --accent:#58a6ff; --panel:#161b22; --card:#0d1117;
        --wall:#6e7681; --good:#3fb950; --bad:#f85149;
        --goodbg:#10261a; --badbg:#2b1416; --accbg:#10263c; --door:#a371f7; }
    }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--fg); }
    .cell { fill:var(--card); stroke:var(--line); stroke-width:1.5; }
    .wall { fill:var(--wall); stroke:var(--wall); stroke-width:1.5; }
    .cur  { fill:var(--accbg); stroke:var(--accent); stroke-width:3; }
    .okc  { fill:var(--goodbg); stroke:var(--good); stroke-width:3; }
    .badc { fill:var(--badbg); stroke:var(--bad); stroke-width:3; }
    .door { fill:var(--card); stroke:var(--door); stroke-width:3; stroke-dasharray:6 4; }
    .mark { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:20px; font-weight:700; }
    .coord { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; fill:var(--muted); }
    .state { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:19px; font-weight:700; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:15px; }
    .lab { font-size:14px; font-weight:700; letter-spacing:1.4px; }
    .note { font-size:14px; fill:var(--muted); }
    .panel { fill:var(--panel); stroke:var(--line); stroke-width:1.5; }
  </style>

  <rect width="960" height="430" rx="18" fill="var(--bg)"/>
  <text class="lab" x="30" y="38" fill="var(--accent)">SAME POSITION &#183; DIFFERENT STATE &#183; DIFFERENT LEGAL MOVES</text>

  <!-- ================= LEFT : no key ================= -->
  <rect class="panel" x="30" y="56" width="440" height="300" rx="14"/>
  <text class="state" x="52" y="88">(4, 3, False)</text>
  <text class="note" x="52" y="112">the agent does not have the key</text>

  <rect class="cell" x="150" y="132" width="58" height="58" rx="6"/>
  <text class="coord" x="179" y="165" text-anchor="middle">3,2</text>
  <rect class="wall" x="212" y="132" width="58" height="58" rx="6"/>
  <rect class="cell" x="274" y="132" width="58" height="58" rx="6"/>
  <text class="coord" x="303" y="165" text-anchor="middle">3,4</text>

  <rect class="okc"  x="150" y="194" width="58" height="58" rx="6"/>
  <text class="coord" x="179" y="227" text-anchor="middle" fill="var(--good)">4,2</text>
  <rect class="cur"  x="212" y="194" width="58" height="58" rx="6"/>
  <text class="mark" x="241" y="231" text-anchor="middle" fill="var(--accent)">@</text>
  <rect class="wall" x="274" y="194" width="58" height="58" rx="6"/>

  <rect class="badc" x="212" y="256" width="58" height="58" rx="6"/>
  <text class="mark" x="241" y="293" text-anchor="middle" fill="var(--bad)">D</text>

  <text class="mono" x="350" y="228" fill="var(--good)">LEFT ok</text>
  <text class="mono" x="350" y="292" fill="var(--bad)">DOWN</text>
  <text class="mono" x="350" y="312" fill="var(--bad)">blocked</text>

  <text class="mono" x="52" y="340">legal moves: <tspan fill="var(--good)">LEFT</tspan> only</text>

  <!-- ================= RIGHT : has key ================= -->
  <rect class="panel" x="490" y="56" width="440" height="300" rx="14"/>
  <text class="state" x="512" y="88">(4, 3, True)</text>
  <text class="note" x="512" y="112">the agent picked the key up earlier</text>

  <rect class="cell" x="610" y="132" width="58" height="58" rx="6"/>
  <text class="coord" x="639" y="165" text-anchor="middle">3,2</text>
  <rect class="wall" x="672" y="132" width="58" height="58" rx="6"/>
  <rect class="cell" x="734" y="132" width="58" height="58" rx="6"/>
  <text class="coord" x="763" y="165" text-anchor="middle">3,4</text>

  <rect class="okc"  x="610" y="194" width="58" height="58" rx="6"/>
  <text class="coord" x="639" y="227" text-anchor="middle" fill="var(--good)">4,2</text>
  <rect class="cur"  x="672" y="194" width="58" height="58" rx="6"/>
  <text class="mark" x="701" y="231" text-anchor="middle" fill="var(--accent)">@</text>
  <rect class="wall" x="734" y="194" width="58" height="58" rx="6"/>

  <rect class="okc" x="672" y="256" width="58" height="58" rx="6"/>
  <text class="mark" x="701" y="293" text-anchor="middle" fill="var(--good)">D</text>

  <text class="mono" x="810" y="228" fill="var(--good)">LEFT ok</text>
  <text class="mono" x="810" y="292" fill="var(--good)">DOWN</text>
  <text class="mono" x="810" y="312" fill="var(--good)">now legal</text>

  <text class="mono" x="512" y="340">legal moves: <tspan fill="var(--good)">LEFT</tspan>, <tspan fill="var(--good)">DOWN</tspan></text>

  <text class="note" x="30" y="386">@ = agent &#183; D = locked door at (5,3) &#183; filled = wall &#183; green = legal next state &#183; red = rejected.</text>
  <text class="note" x="30" y="410" fill="var(--accent)">The two panels show the same (row, column). If the legal moves differ, position alone cannot be the whole state.</text>
</svg>

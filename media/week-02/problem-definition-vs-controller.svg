<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">The problem definition and the Week 2 controller</title>
  <desc id="desc">Two layers. The problem definition holds the maze data and the functions is_legal, neighbours and is_goal, and is reused in later weeks. The Week 2 controller renders the state, shows the legal options and has a human choose one. The loop runs out of neighbours to the options on screen and back again through a person, because the machine cannot yet choose for itself.</desc>

  <style>
    :root {
      --bg:#ffffff; --fg:#1f2328; --muted:#57606a; --line:#d0d7de;
      --accent:#0969da; --panel:#f6f8fa; --card:#ffffff; --temp:#bf8700;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d;
        --accent:#58a6ff; --panel:#161b22; --card:#0d1117; --temp:#d29922; }
    }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--fg); }
    .lab { font-size:13px; font-weight:700; letter-spacing:1.4px; fill:var(--accent); }
    .labt { font-size:13px; font-weight:700; letter-spacing:1.4px; fill:var(--temp); }
    .sub { font-size:12px; fill:var(--muted); }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:14px; font-weight:700; }
    .monosm { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; }
    .body { font-size:13px; font-weight:600; }
    .edge { font-size:12px; fill:var(--muted); }
    .aside { font-size:13px; fill:var(--muted); }
    .panel { fill:var(--panel); stroke:var(--line); stroke-width:1.8; }
    .paneltemp { fill:var(--panel); stroke:var(--temp); stroke-width:1.8; stroke-dasharray:7 5; }
    .box { fill:var(--card); stroke:var(--line); stroke-width:1.8; }
    .boxkey { fill:var(--card); stroke:var(--accent); stroke-width:2.4; }
    .boxhuman { fill:var(--card); stroke:var(--temp); stroke-width:2.4; }
    .connector { stroke:var(--muted); stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  </style>

  <rect width="960" height="470" rx="18" fill="var(--bg)"/>

  <!-- layer 1 : the problem definition -->
  <rect class="panel" x="24" y="24" width="912" height="168" rx="14"/>
  <text class="lab" x="44" y="52">PROBLEM DEFINITION</text>
  <text class="sub" x="240" y="52">what is true and what is legal — reused in every later week</text>

  <rect class="box" x="44" y="70" width="202" height="104" rx="10"/>
  <text class="monosm" x="145" y="114" text-anchor="middle">ROWS, COLS, START,</text>
  <text class="monosm" x="145" y="134" text-anchor="middle">GOAL, WALLS, MOVES</text>

  <rect class="box" x="266" y="70" width="202" height="104" rx="10"/>
  <text class="mono" x="367" y="116" text-anchor="middle">is_legal(state)</text>
  <text class="sub" x="367" y="138" text-anchor="middle">is this state allowed?</text>

  <rect class="boxkey" x="488" y="70" width="202" height="104" rx="10"/>
  <text class="mono" x="589" y="116" text-anchor="middle">neighbours(state)</text>
  <text class="sub" x="589" y="138" text-anchor="middle">every legal next state</text>

  <rect class="box" x="710" y="70" width="202" height="104" rx="10"/>
  <text class="mono" x="811" y="116" text-anchor="middle">is_goal(state)</text>
  <text class="sub" x="811" y="138" text-anchor="middle">are we finished?</text>

  <!-- layer 2 : the temporary controller -->
  <rect class="paneltemp" x="24" y="300" width="912" height="146" rx="14"/>
  <text class="labt" x="44" y="328">WEEK 2 CONTROLLER</text>
  <text class="sub" x="232" y="328">temporary scaffolding</text>

  <rect class="box" x="44" y="346" width="202" height="80" rx="10"/>
  <text class="mono" x="145" y="392" text-anchor="middle">render(state)</text>

  <rect class="box" x="266" y="346" width="202" height="80" rx="10"/>
  <text class="body" x="367" y="392" text-anchor="middle">show legal options</text>

  <rect class="boxhuman" x="488" y="346" width="202" height="80" rx="10"/>
  <text class="body" x="589" y="382" text-anchor="middle">human chooses one</text>
  <text class="sub" x="589" y="402" text-anchor="middle">the machine cannot do this</text>

  <!-- the loop, out of neighbours and back through a person -->
  <path class="connector" d="M560 176 C 540 250, 450 272, 399 341"/>
  <path class="connector" d="M413 338 L399 341 L398 327"/>
  <text class="edge" x="467" y="268" text-anchor="end">every legal move</text>

  <path class="connector" d="M640 344 C 716 288, 704 238, 634 180"/>
  <path class="connector" d="M637 194 L634 180 L648 180"/>
  <text class="edge" x="716" y="268">the one a person picked</text>

  <text class="aside" x="44" y="240">The loop closes only because a person</text>
  <text class="aside" x="44" y="260">is standing inside it. Everything below</text>
  <text class="aside" x="44" y="280">is thrown away once search arrives.</text>
</svg>

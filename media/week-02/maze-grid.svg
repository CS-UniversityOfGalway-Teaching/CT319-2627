  <text class="legend" x="30" y="518">Every cell is addressed as (row, column). S = start (0,0) &#183; G = goal (6,8) &#183; filled = wall &#183; outlined = open cell.</text>
  <text class="legend" x="30" y="542">The walls and the grid size never change: they are part of the problem definition, not part of the current state.</text>

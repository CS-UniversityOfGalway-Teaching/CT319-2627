<svg xmlns="http://www.w3.org/2000/svg" width="688" height="580" viewBox="0 0 688 580" role="img" aria-labelledby="title desc">
  <title id="title">The CT319 Week 2 maze</title>
  <desc id="desc">A seven row by nine column grid. Row and column indices are shown on the axes. S marks the start cell at row 0 column 0, G marks the goal at row 6 column 8, and filled cells are walls.</desc>
  <style>
    :root {
      --bg:#ffffff; --fg:#1f2328; --muted:#57606a; --line:#d0d7de;
      --accent:#0969da; --panel:#f6f8fa; --card:#ffffff;
      --wall:#57606a; --good:#1a7f37; --bad:#cf222e;
      --goodbg:#e8f5ec; --badbg:#fdeceb; --accbg:#ddeeff;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d;
        --accent:#58a6ff; --panel:#161b22; --card:#0d1117;
        --wall:#6e7681; --good:#3fb950; --bad:#f85149;
        --goodbg:#10261a; --badbg:#2b1416; --accbg:#10263c; }
    }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--fg); }
    .axis { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:15px; font-weight:700; fill:var(--muted); }
    .cell { fill:var(--card); stroke:var(--line); stroke-width:1.5; }
    .wall { fill:var(--wall); stroke:var(--wall); stroke-width:1.5; }
    .cellmark { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:20px; font-weight:700; }
    .coord { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; fill:var(--muted); }
    .legend { font-size:14px; fill:var(--muted); }
    .lab { font-size:14px; font-weight:700; letter-spacing:1.4px; fill:var(--accent); }
    .cur { fill:var(--accbg); stroke:var(--accent); stroke-width:3; }
    .okc { fill:var(--goodbg); stroke:var(--good); stroke-width:3; }
    .badc { fill:var(--badbg); stroke:var(--bad); stroke-width:3; }
    .arrow { stroke:var(--muted); stroke-width:2.5; fill:none; stroke-linecap:round; }
    .note { font-size:14px; fill:var(--muted); }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:14px; }
  </style>


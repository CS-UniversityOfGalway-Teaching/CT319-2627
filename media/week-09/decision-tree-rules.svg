<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">A decision tree is a learned sequence of questions</title>
  <desc id="d">A new example enters at the root, which asks whether income is greater than 45. A no leads straight to high risk. A yes leads to a second question, whether savings are greater than 10; no gives high risk and yes gives low risk.</desc>
  <style>
    :root { --bg:#ffffff; --fg:#1f2328; --muted:#57606a; --line:#d0d7de;
      --accent:#0969da; --panel:#f6f8fa; --accentbg:#ddf4ff; --good:#1a7f37; --goodbg:#dafbe1; --warn:#9a6700; --warnbg:#fff8c5; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d;
        --accent:#58a6ff; --panel:#161b22; --accentbg:#0c2d6b; --good:#3fb950; --goodbg:#0f2916; --warn:#d29922; --warnbg:#2d2200; } }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--fg); }
    .lab  { font-size:14px; font-weight:700; letter-spacing:1.4px; fill:var(--accent); }
    .q    { font-size:18px; font-weight:700; text-anchor:middle; }
    .leaf { font-size:16px; font-weight:700; letter-spacing:1.1px; text-anchor:middle; }
    .edge { font-size:14px; font-weight:700; fill:var(--muted); text-anchor:middle; }
    .note { font-size:13.5px; fill:var(--muted); }
    .link { stroke:var(--muted); stroke-width:2.4; fill:none; }
  </style>
  <rect width="960" height="420" rx="18" fill="var(--bg)"/>
  <text class="lab" x="30" y="40">THE TREE LEARNS THE QUESTIONS, NOT JUST THE ANSWERS</text>

  <path class="link" d="M480 122 V148 H215 V172"/>
  <path class="link" d="M480 122 V148 H660 V172"/>
  <path class="link" d="M660 228 V254 H575 V278"/>
  <path class="link" d="M660 228 V254 H845 V278"/>

  <rect x="380" y="64" width="200" height="58" rx="10" fill="var(--accentbg)" stroke="var(--accent)" stroke-width="2.4"/>
  <text class="q" x="480" y="100">income &#62; 45?</text>

  <text class="edge" x="300" y="142">no</text>
  <text class="edge" x="578" y="142">yes</text>

  <rect x="120" y="172" width="190" height="56" rx="10" fill="var(--warnbg)" stroke="var(--warn)" stroke-width="2"/>
  <text class="leaf" x="215" y="207" fill="var(--warn)">HIGH RISK</text>

  <rect x="560" y="172" width="200" height="56" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  <text class="q" x="660" y="207">savings &#62; 10?</text>

  <text class="edge" x="602" y="248">no</text>
  <text class="edge" x="760" y="248">yes</text>

  <rect x="480" y="278" width="190" height="56" rx="10" fill="var(--warnbg)" stroke="var(--warn)" stroke-width="2"/>
  <text class="leaf" x="575" y="313" fill="var(--warn)">HIGH RISK</text>

  <rect x="760" y="278" width="170" height="56" rx="10" fill="var(--goodbg)" stroke="var(--good)" stroke-width="2"/>
  <text class="leaf" x="845" y="313" fill="var(--good)">LOW RISK</text>

  <text class="note" x="30" y="372">A new example enters at the top and follows the branches until it reaches a prediction.</text>
  <text class="note" x="30" y="394">Nobody wrote the thresholds 45 and 10. The learning algorithm searched the training data for splits that separate the classes.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="300" viewBox="0 0 1040 300" role="img" aria-labelledby="t d">
  <title id="t">Hold some labelled examples back before training</title>
  <desc id="d">All 140 labelled examples are split into a training set of 98 examples, used to fit the model, and a test set of 42 examples, kept unseen until evaluation. The split is seventy to thirty per cent and stratified, so the class proportions are preserved in both parts.</desc>
  <style>
    :root { --bg:#ffffff; --fg:#1f2328; --muted:#57606a; --line:#d0d7de;
      --accent:#0969da; --accentbg:#ddf4ff; --good:#1a7f37; --goodbg:#dafbe1; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d;
        --accent:#58a6ff; --accentbg:#0c2d6b; --good:#3fb950; --goodbg:#0f2916; } }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--fg); }
    .lab  { font-size:14px; font-weight:700; letter-spacing:1.4px; fill:var(--accent); }
    .cap  { font-size:12px; font-weight:700; letter-spacing:1.1px; fill:var(--muted); }
    .big  { font-size:22px; font-weight:700; }
    .sub  { font-size:15px; }
    .note { font-size:13.5px; fill:var(--muted); }
    .pct  { font-size:13px; font-weight:700; fill:var(--muted); letter-spacing:1px; }
  </style>
  <rect width="1040" height="300" rx="18" fill="var(--bg)"/>
  <text class="lab" x="30" y="40">ALL 140 LABELLED EXAMPLES, SPLIT BEFORE ANY LEARNING HAPPENS</text>

  <rect x="30" y="76" width="686" height="110" rx="10" fill="var(--accentbg)" stroke="var(--accent)" stroke-width="2.4"/>
  <text class="big" x="56" y="118" fill="var(--accent)">TRAINING SET &#183; 98 examples</text>
  <text class="sub" x="56" y="150">the model is fitted here, and may see every one of them</text>
  <text class="pct" x="690" y="176" text-anchor="end">70%</text>

  <rect x="726" y="76" width="284" height="110" rx="10" fill="var(--goodbg)" stroke="var(--good)" stroke-width="2.4"/>
  <text class="big" x="752" y="118" fill="var(--good)">TEST SET &#183; 42</text>
  <text class="sub" x="752" y="150">kept unseen until</text>
  <text class="sub" x="752" y="170">evaluation</text>
  <text class="pct" x="984" y="176" text-anchor="end">30%</text>

  <text class="cap" x="30" y="218">WHY THE SECOND BOX EXISTS</text>
  <text class="note" x="30" y="246">The test set is the only evidence anyone has about examples the model has never met. Train on all 140 and that evidence is gone &#8212; a</text>
  <text class="note" x="30" y="268">score measured on the examples a model was fitted to tells you it can repeat them, which is not the question being asked.</text>
</svg>

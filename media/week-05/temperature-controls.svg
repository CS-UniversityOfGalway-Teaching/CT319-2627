<svg xmlns="http://www.w3.org/2000/svg" width="980" height="412" viewBox="0 0 980 412" role="img" aria-labelledby="t d">
  <title id="t">What the temperature controls</title>
  <desc id="d">The same rugged profile of h drawn three times. At a high temperature the search roams: it accepts worse moves and climbs out of two basins in turn. At a medium temperature it will still climb a small ridge but not a large one. At a low temperature it refuses to worsen at all and settles into the basin it is in, behaving much like strict hill climbing. Only the willingness to accept a worse move changes between the panels; the problem does not.</desc>
  <style>
    :root {
      --bg:#ffffff; --fg:#1f2328; --muted:#57606a; --line:#d0d7de;
      --accent:#0969da; --panel:#f6f8fa; --card:#ffffff;
      --good:#1a7f37; --bad:#cf222e; --badbg:#ffebe9; --goodbg:#dafbe1;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d;
        --accent:#58a6ff; --panel:#161b22; --card:#0d1117;
        --good:#3fb950; --bad:#f85149; --badbg:#2b1113; --goodbg:#0f2916; }
    }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--fg); }
    .lab   { font-size:14px; font-weight:700; letter-spacing:1.4px; fill:var(--accent); }
    .head  { font-size:13.5px; font-weight:700; letter-spacing:1.2px; fill:var(--accent); }
    .role  { font-size:12.5px; fill:var(--muted); }
    .note  { font-size:13px; fill:var(--muted); }
    .warn  { font-size:12.5px; font-weight:700; fill:var(--bad); }
    .okt   { font-size:12.5px; font-weight:700; fill:var(--good); }
    .monos { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; fill:var(--muted); }
    .panelbox { fill:var(--panel); stroke:var(--line); stroke-width:1.6; }
    .prof  { fill:none; stroke:var(--line); stroke-width:2.6; }
    .run   { fill:none; stroke:var(--accent); stroke-width:3; stroke-linejoin:round; stroke-linecap:round; }
    .worse { fill:none; stroke:var(--bad); stroke-width:3.6; stroke-linejoin:round; stroke-linecap:round; }
    .refuse{ fill:none; stroke:var(--bad); stroke-width:2.2; stroke-linecap:round; stroke-dasharray:5 4; opacity:0.75; }
    .cur   { fill:var(--panel); stroke:var(--accent); stroke-width:2.6; }
    .end   { fill:var(--goodbg); stroke:var(--good); stroke-width:2.6; }
    .track { fill:var(--card); stroke:var(--line); stroke-width:1.4; }
    .fillbar { fill:var(--accent); }
  </style>
  <rect width="980" height="412" rx="18" fill="var(--bg)"/>
  <text class="lab" x="30" y="40">TEMPERATURE CONTROLS ONE THING &#183; HOW WILLING THE SEARCH IS TO ACCEPT A WORSE MOVE</text>
  <text class="note" x="30" y="62">The same problem in all three panels. Only the willingness changes.</text>
  <rect class="panelbox" x="30" y="78" width="290" height="266" rx="12"/>

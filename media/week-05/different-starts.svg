  <path class="run" d="M140.5 130.8 L145.5 135.9 L150.6 141.1 L155.7 146.5 L160.7 151.9 L165.8 157.1 L170.9 162.1 L175.9 166.8 L181.0 171.2 L186.1 175.4 L191.1 179.2 L196.2 182.9 L201.2 186.4 L206.3 189.8 L211.4 193.1 L216.4 196.5 L221.5 199.9 L226.6 203.4 L231.6 206.8 L236.7 210.1 L241.8 213.3 L246.8 216.1 L251.9 218.5 L257.0 220.3" marker-end="url(#a)"/>

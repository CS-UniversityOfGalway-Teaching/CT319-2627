<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">The same climbing rule reaches different optima from different starting candidates</title>
  <desc id="desc">A search landscape with two peaks. Start A sits on the left slope and climbs to the smaller local optimum. Start B sits on the right slope and climbs to the taller global optimum. The rule, the neighbourhood and the evaluation function are identical in both runs; only the initial candidate differs.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 27px; font-weight: 700; }
    .label { font-size: 20px; font-weight: 700; }
    .body { font-size: 19px; }
    .small { font-size: 17px; fill: #57606a; }
    .peak { font-size: 18px; font-weight: 700; }
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="30" y="42" class="title">SAME RULE · DIFFERENT STARTING CANDIDATE</text>

  <!-- axes -->
  <line x1="60" y1="422" x2="920" y2="422" stroke="#8c959f" stroke-width="2"/>
  <line x1="60" y1="422" x2="60" y2="80" stroke="#8c959f" stroke-width="2"/>
  <text x="70" y="76" class="small">solution quality (higher is better)</text>
  <text x="920" y="448" class="small" text-anchor="end">candidate solutions</text>

  <!-- landscape -->
  <path d="M60 352 C140 348 190 300 250 232 C310 300 360 346 440 352 C540 358 600 270 680 132 C760 270 830 344 900 352"
        fill="none" stroke="#1f2328" stroke-width="3"/>

  <!-- peaks -->
  <circle cx="250" cy="232" r="7" fill="#9a6700"/>
  <text x="250" y="212" class="peak" text-anchor="middle" fill="#9a6700">LOCAL OPTIMUM</text>
  <circle cx="680" cy="132" r="7" fill="#1a7f37"/>
  <text x="680" y="112" class="peak" text-anchor="middle" fill="#1a7f37">GLOBAL OPTIMUM</text>

  <!-- climbs -->
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0969da"/>
    </marker>
  </defs>
  <path d="M172 306 Q212 286 243 240" fill="none" stroke="#0969da" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#a1)"/>
  <path d="M543 316 Q624 298 673 142" fill="none" stroke="#0969da" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#a1)"/>

  <!-- starts -->
  <circle cx="162" cy="316" r="8" fill="#0969da"/>
  <text x="162" y="382" class="label" text-anchor="middle" fill="#0969da">START A</text>
  <circle cx="533" cy="326" r="8" fill="#0969da"/>
  <text x="533" y="382" class="label" text-anchor="middle" fill="#0969da">START B</text>

  <text x="30" y="482" class="body">The rule, the neighbourhood and the evaluation function are identical in both runs.</text>
</svg>

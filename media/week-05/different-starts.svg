<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
  <title id="t">The same descending rule reaches different optima from different starting candidates</title>
  <desc id="d">A rugged profile of h, drawn as valleys because lower h is better. Start A sits on the left slope and descends into the shallow first basin, a local optimum. Start B sits on the right slope and descends into the deepest basin, the global optimum. The rule, the neighbourhood and the evaluation function are identical in both runs; only the initial candidate differs.</desc>
  <style>
    :root {
      --bg:#ffffff; --fg:#1f2328; --muted:#57606a; --line:#d0d7de;
      --accent:#0969da; --panel:#f6f8fa;
      --good:#1a7f37; --goodbg:#dafbe1; --bad:#cf222e; --badbg:#ffebe9;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d;
        --accent:#58a6ff; --panel:#161b22;
        --good:#3fb950; --goodbg:#0f2916; --bad:#f85149; --badbg:#2b1113; }
    }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--fg); }
    .lab  { font-size:14px; font-weight:700; letter-spacing:1.4px; fill:var(--accent); }
    .role { font-size:12.5px; fill:var(--muted); }
    .note { font-size:13.5px; fill:var(--muted); }
    .name { font-size:14px; font-weight:700; fill:var(--accent); }
    .warn { font-size:13.5px; font-weight:700; fill:var(--bad); }
    .okt  { font-size:13.5px; font-weight:700; fill:var(--good); }
    .rule { stroke:var(--line); stroke-width:1.2; fill:none; }
    .prof { fill:none; stroke:var(--line); stroke-width:3; }
    .run  { fill:none; stroke:var(--accent); stroke-width:3.2; stroke-dasharray:8 6; stroke-linecap:round; }
    .cur  { fill:var(--panel); stroke:var(--accent); stroke-width:3; }
    .optA { fill:var(--badbg); stroke:var(--bad); stroke-width:2.6; }
    .optC { fill:var(--goodbg); stroke:var(--good); stroke-width:2.6; }
  </style>
  <rect width="960" height="470" rx="18" fill="var(--bg)"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker></defs>
  <text class="lab" x="30" y="40">SAME RULE &#183; DIFFERENT STARTING CANDIDATE</text>
  <text class="role" x="30" y="112">higher h</text>
  <path class="rule" d="M92 330 H900"/>
  <text class="role" x="84" y="335" text-anchor="end">better</text>

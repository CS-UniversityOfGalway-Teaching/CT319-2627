  <text class="name" x="140" y="113" text-anchor="middle">Start A</text>
  <circle class="cur" cx="641" cy="173" r="9"/>
  <text class="name" x="657" y="161">Start B</text>
  <circle class="optA" cx="266" cy="222" r="10"/>
  <text class="warn" x="266" y="254" text-anchor="middle">local optimum</text>
  <circle class="optC" cx="752" cy="330" r="11"/>
  <text class="okt" x="752" y="364" text-anchor="middle">global optimum</text>
  <text class="note" x="30" y="422">Both runs follow the same rule: move to a neighbour with lower h, stop when there is none.</text>
  <text class="note" x="30" y="446">Same neighbourhood, same evaluation. Only the starting candidate differs, and so does where the run ends.</text>
</svg>

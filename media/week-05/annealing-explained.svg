<svg xmlns="http://www.w3.org/2000/svg" width="960" height="556" viewBox="0 0 960 556" role="img" aria-labelledby="t d">
  <title id="t">What simulated annealing does</title>
  <desc id="d">A rugged profile of h with three basins. A strictly improving run slides into the first basin and stops. Simulated annealing accepts some worse moves, so early on it climbs back out over the ridge while the temperature is high, wanders across the middle, and as the temperature falls it settles into the deepest basin on the right. The rule is: a better move is always accepted, a worse move is accepted with a probability that falls as the temperature falls.</desc>

  <style>
    :root {
      --bg:#ffffff; --fg:#1f2328; --muted:#57606a; --line:#d0d7de;
      --accent:#0969da; --panel:#f6f8fa; --card:#ffffff;
      --good:#1a7f37; --goodbg:#dafbe1;
      --bad:#cf222e;  --badbg:#ffebe9;
      --purple:#8250df; --purplebg:#f5eeff;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d;
        --accent:#58a6ff; --panel:#161b22; --card:#0d1117;
        --good:#3fb950; --goodbg:#0f2916;
        --bad:#f85149;  --badbg:#2b1113;
        --purple:#a371f7; --purplebg:#1d162b; }
    }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--fg); }
    .lab   { font-size:14px; font-weight:700; letter-spacing:1.4px; fill:var(--accent); }
    .node  { font-size:14px; font-weight:700; }
    .role  { font-size:12.5px; fill:var(--muted); }
    .note  { font-size:13.5px; fill:var(--muted); }
    .warn  { font-size:13.5px; font-weight:700; fill:var(--bad); }
    .okt   { font-size:13.5px; font-weight:700; fill:var(--good); }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:15px; font-weight:700; }
    .monos { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; }
    .start { fill:var(--panel); stroke:var(--accent); stroke-width:2; }
    .optA  { fill:var(--badbg);  stroke:var(--bad);  stroke-width:2.6; }
    .optC  { fill:var(--goodbg); stroke:var(--good); stroke-width:2.6; }
    .edge  { stroke:var(--muted); stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .dup   { stroke:var(--bad); stroke-width:2.4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .okedge{ stroke:var(--good); stroke-width:2.6; fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:6 4; }
    .dot   { fill:var(--panel); stroke:var(--accent); stroke-width:1.6; }
    .funnel{ fill:var(--badbg); stroke:var(--bad); stroke-width:1.6; stroke-dasharray:5 4; }
    .box   { fill:var(--card); stroke:var(--bad); stroke-width:2.6; }
    .slot  { fill:var(--card); stroke:var(--line); stroke-width:1.8; }
    .slotOn{ fill:var(--goodbg); stroke:var(--good); stroke-width:2.4; }
    .cur   { fill:var(--panel); stroke:var(--accent); stroke-width:3; }
    .panelbox { fill:var(--panel); stroke:var(--line); stroke-width:1.6; }
    .rule  { stroke:var(--line); stroke-width:1.2; fill:none; }
  </style>
  <rect width="960" height="556" rx="18" fill="var(--bg)"/>

  <text class="lab" x="30" y="40">SIMULATED ANNEALING &#183; ACCEPT SOME WORSE MOVES, AND FEWER AS YOU GO</text>
  <text class="role" x="30" y="112">higher h</text>
  <path class="rule" d="M92 330 H900"/>
  <text class="role" x="84" y="335" text-anchor="end">better</text>

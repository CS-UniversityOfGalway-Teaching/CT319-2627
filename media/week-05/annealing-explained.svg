  <path d="M128.4 124.5 L172.8 167.0 L221.3 202.2 L265.7 223.6 L298.0 203.3 L276.2 221.5 L330.4 159.1 L370.0 135.0 L415.2 142.8 L471.8 176.7 L514.6 209.9 L552.6 181.6 L534.8 200.6 L576.8 157.7 L595.4 151.5 L657.6 190.6 L714.2 285.9 L752.1 330.0 L774.8 314.7 L752.1 330.0" fill="none" stroke="var(--accent)" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M265.7 223.6 L298.0 203.3 L276.2 221.5 L330.4 159.1 L370.0 135.0" fill="none" stroke="var(--bad)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M514.6 209.9 L552.6 181.6 L534.8 200.6 L576.8 157.7 L595.4 151.5" fill="none" stroke="var(--bad)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="cur" cx="128" cy="124" r="9"/>
  <text class="role" x="128" y="106" text-anchor="middle">start</text>
  <circle class="optA" cx="266" cy="224" r="10"/>
  <text class="warn" x="266" y="256" text-anchor="middle">a strict rule stops here</text>
  <text class="warn" x="370" y="119" text-anchor="middle">worse moves, accepted</text>
  <circle class="optC" cx="752" cy="330" r="11"/>
  <text class="okt" x="752" y="362" text-anchor="middle">settles here</text>
  <defs><linearGradient id="temp" x1="0" x2="1"><stop offset="0" stop-color="var(--bad)"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs>
  <rect x="92" y="386" width="808" height="14" rx="7" fill="url(#temp)" opacity="0.85"/>
  <text class="role" x="92" y="420">hot &#8212; worse moves accepted often</text>
  <text class="role" x="900" y="420" text-anchor="end">cold &#8212; almost never</text>
  <text class="note" x="496" y="376" text-anchor="middle">temperature falls as the run goes on</text>
  <path class="rule" d="M30 448 H930"/>
  <text class="note" x="30" y="474">A better move is always accepted. A worse move is accepted <tspan font-style="italic">sometimes</tspan> &#8212; with a probability that falls as the temperature falls.</text>
  <text class="note" x="30" y="498">Early on that buys escape from a basin like the first one. Later it stops, so the run can settle instead of wandering forever.</text>
  <text class="note" x="30" y="522">Accept every worse move and the heuristic is discarded; accept none and this is strict hill climbing again.</text>
</svg>

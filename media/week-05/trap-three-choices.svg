<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Strict hill climbing stops at (4,8), and the three choices Week 5 can change</title>
  <desc id="desc">At state 4,8 the heuristic is 2. Both legal neighbours, UP to 3,8 and LEFT to 4,7, have heuristic 3, so the strict rule rejects both and the search stops with legal moves still available. Three panels then name what can change without changing the problem definition: START, where the search begins; NEIGHBOURHOOD, which alternatives are inspected; ACCEPTANCE, which candidate moves are taken.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 27px; font-weight: 700; }
    .label { font-size: 21px; font-weight: 700; }
    .body { font-size: 19px; }
    .small { font-size: 17px; fill: #57606a; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 24px; font-weight: 700; }
    .monos { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 19px; font-weight: 700; }
    .reject { font-size: 17px; font-weight: 700; fill: #cf222e; }
  </style>
  <rect width="100%" height="100%" fill="#fff"/>

  <text x="30" y="42" class="title">STRICT HILL CLIMBING STOPS AT (4,8)</text>

  <!-- current state -->
  <rect x="395" y="72" width="170" height="88" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="2.5"/>
  <text x="480" y="106" class="mono" text-anchor="middle">(4,8)</text>
  <text x="480" y="140" class="monos" text-anchor="middle">h = 2</text>

  <!-- branches -->
  <path d="M430 162 L318 202" fill="none" stroke="#57606a" stroke-width="2.5" marker-end="url(#head)"/>
  <path d="M530 162 L642 202" fill="none" stroke="#57606a" stroke-width="2.5" marker-end="url(#head)"/>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="185" y="208" width="230" height="88" rx="10" fill="#f6f8fa" stroke="#cf222e" stroke-width="2.5"/>
  <text x="300" y="242" class="monos" text-anchor="middle">UP → (3,8)</text>
  <text x="300" y="272" class="reject" text-anchor="middle">h = 3 · REJECTED</text>

  <rect x="545" y="208" width="230" height="88" rx="10" fill="#f6f8fa" stroke="#cf222e" stroke-width="2.5"/>
  <text x="660" y="242" class="monos" text-anchor="middle">LEFT → (4,7)</text>
  <text x="660" y="272" class="reject" text-anchor="middle">h = 3 · REJECTED</text>

  <text x="480" y="334" class="body" text-anchor="middle">Legal moves remain. The strict acceptance rule takes none of them.</text>

  <line x1="30" y1="362" x2="930" y2="362" stroke="#d0d7de" stroke-width="2"/>
  <text x="30" y="398" class="label">WHAT CAN CHANGE WITHOUT CHANGING THE PROBLEM?</text>

  <rect x="30" y="414" width="288" height="106" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="52" y="450" class="label">START</text>
  <text x="52" y="480" class="small">Where does the search</text>
  <text x="52" y="502" class="small">begin?</text>

  <rect x="336" y="414" width="288" height="106" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="358" y="450" class="label">NEIGHBOURHOOD</text>
  <text x="358" y="480" class="small">Which alternatives do we</text>
  <text x="358" y="502" class="small">inspect?</text>

  <rect x="642" y="414" width="288" height="106" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="664" y="450" class="label">ACCEPTANCE</text>
  <text x="664" y="480" class="small">Which of those moves are</text>
  <text x="664" y="502" class="small">we willing to take?</text>
</svg>

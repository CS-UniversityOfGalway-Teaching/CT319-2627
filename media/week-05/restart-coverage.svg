<svg xmlns="http://www.w3.org/2000/svg" width="960" height="624" viewBox="0 0 960 624" role="img" aria-labelledby="t d">
  <title id="t">What restarting buys, and what restarting everywhere costs</title>
  <desc id="d">Two panels. In the first, four starts run the same hill-climbing rule and reach three outcomes: starts 1 and 3 both end at local optimum A, start 2 ends at local optimum B, and start 4 reaches the better optimum C. Two of the four runs therefore sample the same region. In the second panel every candidate in the space is used as a start, which visits the whole space and is exhaustive search: the very thing restarts were meant to avoid.</desc>

  <style>
    :root {
      --bg:#ffffff; --fg:#1f2328; --muted:#57606a; --line:#d0d7de;
      --accent:#0969da; --panel:#f6f8fa; --card:#ffffff;
      --good:#1a7f37; --goodbg:#dafbe1;
      --bad:#cf222e;  --badbg:#ffebe9;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d;
        --accent:#58a6ff; --panel:#161b22; --card:#0d1117;
        --good:#3fb950; --goodbg:#0f2916;
        --bad:#f85149;  --badbg:#2b1113; }
    }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--fg); }
    .lab   { font-size:14px; font-weight:700; letter-spacing:1.4px; fill:var(--accent); }
    .node  { font-size:14px; font-weight:700; }
    .role  { font-size:12.5px; fill:var(--muted); }
    .note  { font-size:13.5px; fill:var(--muted); }
    .warn  { font-size:13.5px; font-weight:700; fill:var(--bad); }
    .start { fill:var(--panel); stroke:var(--accent); stroke-width:2; }
    .optA  { fill:var(--badbg);  stroke:var(--bad);  stroke-width:2.6; }
    .optC  { fill:var(--goodbg); stroke:var(--good); stroke-width:2.6; }
    .edge  { stroke:var(--muted); stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .dup   { stroke:var(--bad); stroke-width:2.4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .dot   { fill:var(--panel); stroke:var(--accent); stroke-width:1.6; }
    .funnel{ fill:var(--badbg); stroke:var(--bad); stroke-width:1.6; stroke-dasharray:5 4; }
    .box   { fill:var(--card); stroke:var(--bad); stroke-width:2.6; }
    .rule  { stroke:var(--line); stroke-width:1.2; fill:none; }
  </style>

  <rect width="960" height="624" rx="18" fill="var(--bg)"/>
  <text class="lab" x="30" y="40">FOUR STARTS, THREE OUTCOMES &#183; SOME OF THEM THE SAME</text>
  <rect class="start" x="116" y="76" width="108" height="42" rx="10"/>
  <text class="node" x="170" y="103" text-anchor="middle">start 1</text>
  <rect class="start" x="326" y="76" width="108" height="42" rx="10"/>
  <text class="node" x="380" y="103" text-anchor="middle">start 2</text>
  <rect class="start" x="536" y="76" width="108" height="42" rx="10"/>
  <text class="node" x="590" y="103" text-anchor="middle">start 3</text>
  <rect class="start" x="746" y="76" width="108" height="42" rx="10"/>
  <text class="node" x="800" y="103" text-anchor="middle">start 4</text>
  <circle class="optA" cx="275" cy="238" r="34"/>
  <text class="node" x="275" y="245" text-anchor="middle" fill="var(--bad)">A</text>
  <text class="role" x="275" y="298" text-anchor="middle">local optimum A</text>
  <circle class="optA" cx="485" cy="238" r="34"/>
  <text class="node" x="485" y="245" text-anchor="middle" fill="var(--bad)">B</text>
  <text class="role" x="485" y="298" text-anchor="middle">local optimum B</text>
  <circle class="optC" cx="800" cy="238" r="34"/>
  <text class="node" x="800" y="245" text-anchor="middle" fill="var(--good)">C</text>
  <text class="role" x="800" y="298" text-anchor="middle">better optimum C</text>
  <path class="dup" d="M170 122 Q210 167 251 212"/>
  <path class="dup" d="M248 199 L251 212 L239 208"/>

  <path class="edge" d="M380 122 Q426 165 471 208"/>
  <path class="edge" d="M467 196 L471 208 L458 205"/>

  <path class="dup" d="M590 122 Q446 166 301 210"/>
  <path class="dup" d="M314 213 L301 210 L310 201"/>

  <path class="edge" d="M800 122 Q800 162 800 202"/>
  <path class="edge" d="M806 191 L800 202 L794 191"/>

  <text class="warn" x="30" y="332">Starts 1 and 3 land in the same basin: four runs, but only three regions sampled.</text>
  <text class="note" x="30" y="354">Keep the best seen &#8212; C &#8212; but nothing here proves C is the global optimum.</text>
  <path class="rule" d="M30 384 H930"/>
  <text class="lab" x="30" y="418">&#8230; SO WHY NOT RESTART FROM EVERYWHERE?</text>
  <circle class="dot" cx="120" cy="482" r="9"/>
  <circle class="dot" cx="165" cy="482" r="9"/>
  <circle class="dot" cx="210" cy="482" r="9"/>
  <circle class="dot" cx="255" cy="482" r="9"/>
  <circle class="dot" cx="300" cy="482" r="9"/>
  <circle class="dot" cx="345" cy="482" r="9"/>
  <circle class="dot" cx="390" cy="482" r="9"/>
  <circle class="dot" cx="435" cy="482" r="9"/>
  <circle class="dot" cx="480" cy="482" r="9"/>
  <circle class="dot" cx="525" cy="482" r="9"/>
  <circle class="dot" cx="570" cy="482" r="9"/>
  <circle class="dot" cx="615" cy="482" r="9"/>
  <circle class="dot" cx="660" cy="482" r="9"/>
  <circle class="dot" cx="705" cy="482" r="9"/>
  <circle class="dot" cx="750" cy="482" r="9"/>
  <circle class="dot" cx="795" cy="482" r="9"/>
  <circle class="dot" cx="840" cy="482" r="9"/>
  <text class="note" x="30" y="448">Use every candidate as a start, and you have visited every candidate:</text>
  <path class="funnel" d="M112 498 H848 L586 546 H374 Z"/>
  <rect class="box" x="374" y="546" width="212" height="42" rx="10"/>
  <text class="node" x="480" y="573" text-anchor="middle" fill="var(--bad)">the whole space</text>
  <text class="warn" x="612" y="573">that is exhaustive search again</text>
  <text class="note" x="30" y="573">Restarts buy coverage</text>
  <text class="note" x="30" y="591">and pay for it in runs.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="688" height="620" viewBox="0 0 688 620" role="img" aria-labelledby="t d">
  <title id="t">Stuck at (4,8): every legal move makes h worse</title>
  <desc id="d">The Week 2 maze with the Manhattan heuristic on every open cell. The current state (4,8) has h of 2. Its only two legal neighbours, (3,8) above and (4,7) to the left, both have h of 3. Below is a wall, so DOWN is not a legal move, and there is no column 9. Strict hill climbing therefore stops, even though the goal at (6,8) has h of 0.</desc>

  <style>
    :root {
      --bg:#ffffff; --fg:#1f2328; --muted:#57606a; --line:#d0d7de;
      --accent:#0969da; --panel:#f6f8fa; --card:#ffffff;
      --wall:#57606a; --good:#1a7f37; --bad:#cf222e;
      --goodbg:#e8f5ec; --badbg:#fdeceb; --accbg:#ddeeff;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d;
        --accent:#58a6ff; --panel:#161b22; --card:#0d1117;
        --wall:#6e7681; --good:#3fb950; --bad:#f85149;
        --goodbg:#10261a; --badbg:#2b1416; --accbg:#10263c; }
    }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--fg); }
    .axis { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:15px; font-weight:700; fill:var(--muted); }
    .cell { fill:var(--card); stroke:var(--line); stroke-width:1.5; }
    .wall { fill:var(--wall); stroke:var(--wall); stroke-width:1.5; }
    .cur  { fill:var(--accbg); stroke:var(--accent); stroke-width:3; }
    .okc  { fill:var(--goodbg); stroke:var(--good); stroke-width:3; }
    .badc { fill:var(--badbg); stroke:var(--bad); stroke-width:3; }
    .hval { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:15px; fill:var(--muted); }
    .hbig { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:17px; font-weight:700; }
    .mark { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; font-weight:700; }
    .lab  { font-size:14px; font-weight:700; letter-spacing:1.4px; fill:var(--accent); }
    .legend { font-size:13px; fill:var(--muted); }
    .route { stroke:var(--accent); stroke-width:3.4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .routeBad { stroke:var(--bad); stroke-width:3.8; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  </style>


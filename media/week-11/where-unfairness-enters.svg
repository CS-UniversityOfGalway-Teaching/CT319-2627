<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" role="img" aria-labelledby="t d">
  <title id="t">Seven decisions build a system, and unfairness can enter at any of them</title>
  <desc id="d">A chain runs from purpose, to data, to labels, to features, to model, to decision rule, to use. Each step carries its own question: what is this for, who is represented, what counts as correct, why should this matter, does performance differ by group, how do scores become actions, and what happens to the person affected. Four of the seven are decided before any model exists.</desc>
  <style>
    :root { --bg:#ffffff; --fg:#1f2328; --muted:#57606a; --line:#d0d7de;
      --accent:#0969da; --panel:#f6f8fa; --accentbg:#ddf4ff; --warn:#9a6700; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d;
        --accent:#58a6ff; --panel:#161b22; --accentbg:#0c2d6b; --warn:#d29922; } }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--fg); }
    .lab  { font-size:14px; font-weight:700; letter-spacing:1.4px; fill:var(--accent); }
    .cap  { font-size:12px; font-weight:700; letter-spacing:1.1px; fill:var(--muted); }
    .node { font-size:13px; font-weight:700; letter-spacing:0.8px; text-anchor:middle; }
    .q    { font-size:11.5px; fill:var(--muted); text-anchor:middle; }
    .note { font-size:13.5px; fill:var(--muted); }
    .box  { fill:var(--panel); stroke:var(--line); stroke-width:2; }
    .box--m { fill:var(--accentbg); stroke:var(--accent); stroke-width:2.4; }
    .arr  { stroke:var(--muted); stroke-width:2.2; fill:none; marker-end:url(#a); }
    .tick { stroke:var(--warn); stroke-width:2.2; }
  </style>
  <rect width="1040" height="400" rx="18" fill="var(--bg)"/>
  <text class="lab" x="30" y="40">A SYSTEM IS A SEQUENCE OF CHOICES &#183; EVERY ONE OF THEM IS A PLACE UNFAIRNESS CAN ENTER</text>

  <line x1="82" y1="72" x2="958" y2="72" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 5"/>
  <line class="tick" x1="82" y1="72" x2="82" y2="98"/>
  <line class="tick" x1="228" y1="72" x2="228" y2="98"/>
  <line class="tick" x1="374" y1="72" x2="374" y2="98"/>
  <line class="tick" x1="520" y1="72" x2="520" y2="98"/>
  <line class="tick" x1="666" y1="72" x2="666" y2="98"/>
  <line class="tick" x1="812" y1="72" x2="812" y2="98"/>
  <line class="tick" x1="958" y1="72" x2="958" y2="98"/>

  <rect class="box" x="25" y="106" width="114" height="64" rx="10"/>
  <text class="node" x="82" y="144">PURPOSE</text>
  <text class="q"    x="82" y="194">what is this for?</text>
  <path class="arr" d="M143 138 H167"/>

  <rect class="box" x="171" y="106" width="114" height="64" rx="10"/>
  <text class="node" x="228" y="144">DATA</text>
  <text class="q"    x="228" y="194">who is represented?</text>
  <path class="arr" d="M289 138 H313"/>

  <rect class="box" x="317" y="106" width="114" height="64" rx="10"/>
  <text class="node" x="374" y="144">LABELS</text>
  <text class="q"    x="374" y="194">what counts as</text>
  <text class="q"    x="374" y="210">the right answer?</text>
  <path class="arr" d="M435 138 H459"/>

  <rect class="box" x="463" y="106" width="114" height="64" rx="10"/>
  <text class="node" x="520" y="144">FEATURES</text>
  <text class="q"    x="520" y="194">why should this</text>
  <text class="q"    x="520" y="210">variable matter?</text>
  <path class="arr" d="M581 138 H605"/>

  <rect class="box--m" x="609" y="106" width="114" height="64" rx="10"/>
  <text class="node" x="666" y="144">MODEL</text>
  <text class="q"    x="666" y="194">does performance</text>
  <text class="q"    x="666" y="210">differ by group?</text>
  <path class="arr" d="M727 138 H751"/>

  <rect class="box" x="755" y="106" width="114" height="64" rx="10"/>
  <text class="node" x="812" y="138">DECISION</text>
  <text class="node" x="812" y="156">RULE</text>
  <text class="q"    x="812" y="194">how does a score</text>
  <text class="q"    x="812" y="210">become an action?</text>
  <path class="arr" d="M873 138 H897"/>

  <rect class="box" x="901" y="106" width="114" height="64" rx="10"/>
  <text class="node" x="958" y="144">USE</text>
  <text class="q"    x="958" y="194">what happens to</text>
  <text class="q"    x="958" y="210">the person affected?</text>

  <text class="cap" x="30" y="268" fill="var(--warn)">BEFORE A MODEL EXISTS AT ALL</text>
  <rect x="25" y="282" width="552" height="4" rx="2" fill="var(--warn)" opacity="0.5"/>
  <text class="note" x="30" y="318">Four of the seven decisions are already made by the time anything is fitted. The one box most people mean by "the AI" is the fifth.</text>
  <text class="note" x="30" y="352">Fairness is not a check applied after training. The only place it can be applied is across all seven.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="t d">
  <title id="t">One accuracy figure averaged over two very different groups</title>
  <desc id="d">A classifier scores 92.8 per cent overall, 928 of 1000 correct. Split by group, it scores 96 per cent on Group A, where 768 of 800 are correct, and 80 per cent on Group B, where 160 of 200 are correct. Because Group A is four times larger, the overall figure mostly reports Group A's experience.</desc>
  <style>
    :root { --bg:#ffffff; --fg:#1f2328; --muted:#57606a; --line:#d0d7de;
      --accent:#0969da; --panel:#f6f8fa; --good:#1a7f37; --warn:#9a6700; --track:#eaeef2; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d;
        --accent:#58a6ff; --panel:#161b22; --good:#3fb950; --warn:#d29922; --track:#21262d; } }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--fg); }
    .lab  { font-size:14px; font-weight:700; letter-spacing:1.4px; fill:var(--accent); }
    .cap  { font-size:12.5px; font-weight:700; letter-spacing:1.1px; fill:var(--muted); }
    .huge { font-size:62px; font-weight:700; }
    .grp  { font-size:17px; font-weight:700; }
    .val  { font-size:17px; font-weight:700; text-anchor:end; }
    .sub  { font-size:13px; fill:var(--muted); }
    .note { font-size:13.5px; fill:var(--muted); }
  </style>
  <rect width="1040" height="360" rx="18" fill="var(--bg)"/>
  <text class="lab" x="30" y="40">THE SAME CLASSIFIER, REPORTED TWO WAYS</text>

  <rect x="30" y="62" width="330" height="236" rx="12" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  <text class="cap"  x="56" y="92">WHAT THE HEADLINE SAYS</text>
  <text class="huge" x="56" y="170">92.8%</text>
  <text class="sub"  x="56" y="200">928 of 1000 test examples correct</text>
  <text class="sub"  x="56" y="248">One number. One thousand people.</text>
  <text class="sub"  x="56" y="270">Nobody disagrees with it.</text>

  <rect x="390" y="62" width="620" height="236" rx="12" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  <text class="cap" x="416" y="92">WHAT IT IS AN AVERAGE OF</text>

  <text class="grp" x="416" y="146">Group A</text>
  <text class="sub" x="416" y="166">800 examples &#183; 768 correct</text>
  <rect x="560" y="126" width="300" height="26" rx="5" fill="var(--track)"/>
  <rect x="560" y="126" width="288" height="26" rx="5" fill="var(--good)"/>
  <text class="val" x="984" y="147">96%</text>

  <text class="grp" x="416" y="222">Group B</text>
  <text class="sub" x="416" y="242">200 examples &#183; 160 correct</text>
  <rect x="560" y="202" width="300" height="26" rx="5" fill="var(--track)"/>
  <rect x="560" y="202" width="240" height="26" rx="5" fill="var(--warn)"/>
  <text class="val" x="984" y="223">80%</text>

  <text class="sub" x="416" y="278">Sixteen points apart, and neither number appears on the left.</text>

  <text class="note" x="30" y="336">The headline is not wrong. It is an average over a thousand people, four fifths of whom are in Group A &#8212; so it mostly reports Group A's experience.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="t d">
  <title id="t">Responsibility runs across everyone who built, bought and used the system</title>
  <desc id="d">Five parties sit along a chain: the vendor, the developer, the data team, the deploying organisation and the staff member who acted on the score. Below them, the claim that the AI did it is marked as not an accountability model, because every link in the chain is a person or an organisation.</desc>
  <style>
    :root { --bg:#ffffff; --fg:#1f2328; --muted:#57606a; --line:#d0d7de;
      --accent:#0969da; --panel:#f6f8fa; --bad:#cf222e; --badbg:#ffebe9; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d;
        --accent:#58a6ff; --panel:#161b22; --bad:#f85149; --badbg:#2d0f0f; } }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--fg); }
    .lab  { font-size:14px; font-weight:700; letter-spacing:1.4px; fill:var(--accent); }
    .node { font-size:13.5px; font-weight:700; letter-spacing:0.8px; text-anchor:middle; }
    .q    { font-size:11.5px; fill:var(--muted); text-anchor:middle; }
    .big  { font-size:21px; font-weight:700; }
    .note { font-size:13.5px; fill:var(--muted); }
    .box  { fill:var(--panel); stroke:var(--line); stroke-width:2; }
  </style>
  <rect width="1040" height="360" rx="18" fill="var(--bg)"/>
  <text class="lab" x="30" y="40">SOMETHING WENT WRONG &#183; WHO IS RESPONSIBLE?</text>

  <line x1="26" y1="128" x2="1014" y2="128" stroke="var(--line)" stroke-width="3"/>

  <rect class="box" x="26"  y="96" width="180" height="64" rx="10"/>
  <text class="node" x="116" y="134">THE VENDOR</text>
  <text class="q"    x="116" y="184">sold it</text>

  <rect class="box" x="228" y="96" width="180" height="64" rx="10"/>
  <text class="node" x="318" y="134">THE DEVELOPER</text>
  <text class="q"    x="318" y="184">built it</text>

  <rect class="box" x="430" y="96" width="180" height="64" rx="10"/>
  <text class="node" x="520" y="134">THE DATA TEAM</text>
  <text class="q"    x="520" y="184">chose what it learned from</text>

  <rect class="box" x="632" y="96" width="180" height="64" rx="10"/>
  <text class="node" x="722" y="126">THE DEPLOYING</text>
  <text class="node" x="722" y="146">ORGANISATION</text>
  <text class="q"    x="722" y="184">decided to run it</text>

  <rect class="box" x="834" y="96" width="180" height="64" rx="10"/>
  <text class="node" x="924" y="126">THE STAFF</text>
  <text class="node" x="924" y="146">MEMBER</text>
  <text class="q"    x="924" y="184">acted on the score</text>

  <rect x="26" y="226" width="988" height="62" rx="10" fill="var(--badbg)" stroke="var(--bad)" stroke-width="2.4"/>
  <text class="big" x="52" y="265" fill="var(--bad)">&#8220;The AI did it&#8221; is not an accountability model.</text>

  <text class="note" x="30" y="322">AI systems are designed, purchased, configured, deployed and acted upon by people and organisations. Responsibility exists across that whole chain</text>
  <text class="note" x="30" y="344">&#8212; including afterwards. Who monitors the running system, investigates complaints, and has the authority to change or withdraw it?</text>
</svg>
